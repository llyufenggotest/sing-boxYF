name: Build unsigned iOS IPA with sideload dylib

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label
        required: true
        type: string
        default: 1.14.1-yf.unsigned

concurrency:
  group: unsigned-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned SFI arm64 IPA
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: false

      - name: Patch Go for iOS
        run: .github/patch_go_for_ios.sh

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: unsigned-ios-go-${{ hashFiles('go.sum') }}
          restore-keys: unsigned-ios-go-

      - name: Build iOS arm64 Libbox
        env:
          GOTOOLCHAIN: local
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target apple -platform ios/arm64

      - name: Merge Libbox framework
        run: |
          mkdir -p clients/apple/Libbox.xcframework
          cp -R Libbox.xcframework/* clients/apple/Libbox.xcframework/

      - name: Install sideload loader into Apple client
        run: |
          cp apple/patches/SideloadCompatibilityLoader.swift clients/apple/SFI/SideloadCompatibilityLoader.swift

          python3 - <<'PY'
          from pathlib import Path
          app = Path('clients/apple/SFI/ApplicationDelegate.swift')
          text = app.read_text()
          needle = '        LibboxReinstallCrashSignalHandlers()\n'
          if 'SideloadCompatibilityLoader.load()' not in text:
              text = text.replace(needle, needle + '        SideloadCompatibilityLoader.load()\n', 1)
          app.write_text(text)
          ext = Path('clients/apple/Extension/PacketTunnelProvider.swift')
          ext.write_text('''import Darwin\nimport Foundation\nimport Library\n\nprivate enum SideloadCompatibilityLoader {\n    private static let name = "Tg_@HelloWorld_1024.dylib"\n    private static var handle: UnsafeMutableRawPointer?\n\n    static func load() {\n        guard handle == nil else { return }\n        let path = Bundle.main.privateFrameworksPath.map { URL(fileURLWithPath: $0).appendingPathComponent(name).path } ?? "@rpath/\\(name)"\n        handle = dlopen(path, RTLD_NOW | RTLD_LOCAL)\n        if handle == nil { NSLog("sideload compatibility dylib unavailable") }\n    }\n}\n\nclass PacketTunnelProvider: ExtensionProvider {\n    override func startTunnel(options: [String: NSObject]?, completionHandler: @escaping (Error?) -> Void) {\n        SideloadCompatibilityLoader.load()\n        super.startTunnel(options: options, completionHandler: completionHandler)\n    }\n}\n''')
          PY

      - name: Build unsigned SFI app with loader
        working-directory: clients/apple
        env:
          XCODEBUILD_CLONED_SOURCE_PACKAGES_DIR_PATH: ${{ runner.temp }}/SourcePackages
        run: |
          rm -rf build/unsigned
          xcodebuild build \
            -clonedSourcePackagesDirPath "$XCODEBUILD_CLONED_SOURCE_PACKAGES_DIR_PATH" \
            -scheme SFI -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/unsigned \
            BASE_PACKAGE_IDENTIFIER=io.llyufenggotest.singboxyf \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ENABLE_BITCODE=NO

      - name: Verify approved dylib
        working-directory: clients/apple
        run: |
          test "$(shasum -a 256 ../../ios/SideloadSupport/Tg_@HelloWorld_1024.dylib | cut -d' ' -f1)" = cd903ea15657cbd356398adcb60c8872c41c29b69acc1a5dfb78a49d6e75dea5
          file ../../ios/SideloadSupport/Tg_@HelloWorld_1024.dylib | grep -F 'arm64'

      - name: Assemble unsigned IPA
        env:
          DYLIB_SHA256: cd903ea15657cbd356398adcb60c8872c41c29b69acc1a5dfb78a49d6e75dea5
        run: |
          APP="clients/apple/build/unsigned/Build/Products/Release-iphoneos/sing-box.app"
          test -d "$APP"
          bash scripts/inject_sideload_dylib.sh "$APP" ios/SideloadSupport/Tg_@HelloWorld_1024.dylib
          test -f "$APP/Frameworks/Tg_@HelloWorld_1024.dylib"
          test -f "$APP/PlugIns/Extension.appex/Frameworks/Tg_@HelloWorld_1024.dylib"
          test "$(shasum -a 256 "$APP/Frameworks/Tg_@HelloWorld_1024.dylib" | cut -d' ' -f1)" = "$DYLIB_SHA256"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/SFI.app
          (cd dist && zip -qry "sing-boxYF-${{ inputs.version }}-unsigned.ipa" Payload)
          unzip -l "dist/sing-boxYF-${{ inputs.version }}-unsigned.ipa" | grep -F 'Tg_@HelloWorld_1024.dylib'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: sing-boxYF-ios-arm64-unsigned-${{ inputs.version }}
          path: dist/*.ipa
          if-no-files-found: error
